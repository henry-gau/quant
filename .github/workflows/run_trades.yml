name: Run Congressional Trading Bot

on:
  push:
    branches:
      - main
    paths:
      - 'congress_trades.csv'
  schedule:
    # Morning check: 9:35 AM Eastern Time (Mon-Fri)
    - cron: '35 9 * * 1-5'
      timezone: 'America/New_York'
    # Midday check: 12:30 PM Eastern Time (Mon-Fri — fires before 1:00 PM early-close days)
    - cron: '30 12 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch: # Allows manual testing anytime from the Actions tab

jobs:
  execute-trades:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Alpaca SDK
        run: pip install alpaca-py

      - name: Run trading bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python trade_bot.py
