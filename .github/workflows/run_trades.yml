name: Run Congressional Trading Bot

on:
  push:
    branches:
      - main
    paths:
      - 'congress_trades.csv'
  schedule:
    # Morning check: 9:35 AM EST (14:35 UTC, Mon-Fri)
    - cron: '35 14 * * 1-5'
    # Afternoon check: 1:15 PM EST (18:15 UTC, Mon-Fri)
    - cron: '15 18 * * 1-5'
  workflow_dispatch: # Allows manual testing anytime from the Actions tab

jobs:
  execute-trades:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Alpaca SDK
        run: pip install alpaca-py

      - name: Run trading bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python trade_bot.py
