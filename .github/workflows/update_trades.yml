name: Update Congress Trades CSV Daily

on:
  schedule:
    - cron: '0 22 * * 1-5' # Runs every weekday at 10:00 PM UTC
  workflow_dispatch: # Allows manual runs from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas PyGithub

      - name: Run Data Sync Script
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_trades.py
